<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chilly — Desktop Fridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage">
    <div id="toast" role="status"></div>

    <section id="fridge" aria-label="Interactive refrigerator">
      <div class="floor-shadow"></div>
      <div class="fridge-body">
        <div class="top-cap">
          <span class="brand"><b>CHILLY</b><i>✦</i></span>
          <button id="settings-button" aria-label="Open fridge settings">⚙</button>
          <button id="quit" aria-label="Close app">×</button>
        </div>

        <div id="interior">
          <div class="light-glow"></div>
          <div class="back-wall">
            <div class="lamp">☀</div>
            <div class="shelf shelf-one"></div>
            <div class="shelf shelf-two"></div>
            <div class="shelf shelf-three"></div>
            <div class="cold-label">❄ FRESH ZONE</div>
          </div>

          <div id="food-zone" aria-label="Fridge shelves"></div>

          <div id="vegetable-drawer" class="drawer closed" tabindex="0" role="button" aria-label="Vegetable drawer">
            <div class="drawer-bin">
              <div class="veggie-pile">
                <span>🥬</span><span>🥕</span><span>🥦</span><span>🍆</span>
                <span>🌽</span><span>🥒</span><span>🫑</span><span>🍅</span>
                <span>🥔</span><span>🧅</span><span>🥕</span><span>🥦</span>
              </div>
            </div>
            <div class="drawer-face">
              <span>VEGGIES</span>
              <div class="drawer-handle"></div>
              <small>FRESH &amp; CRUNCHY</small>
            </div>
          </div>

          <section id="settings-panel" aria-label="Fridge settings">
            <div class="settings-card">
              <span class="settings-kicker">CHILLY CONTROL PANEL</span>
              <h2>Stock the fridge</h2>
              <p>Choose how many items appear inside.</p>

              <div id="settings-list"></div>

              <div class="settings-actions">
                <button id="cancel-settings" type="button">Cancel</button>
                <button id="save-settings" type="button">Save stock</button>
              </div>
            </div>
          </section>
        </div>

        <button id="main-door" class="door closed" aria-label="Open refrigerator">
          <div class="door-front">
            <div class="shine"></div>
            <div class="handle"></div>
            <div class="magnet magnet-one door-movable" data-memory-key="cool-vibes">COOL<br>VIBES</div>
            <div class="magnet magnet-two door-movable" data-memory-key="heart">♥</div>
            <div class="note door-movable" data-memory-key="snack-note">DON'T<br>FORGET<br>THE SNACKS!</div>
            <div id="clock-magnet" class="clock-magnet door-movable" data-memory-key="clock">
              <time id="clock-time">--:--</time>
              <span id="clock-date">---</span>
            </div>
            <div class="status-dot"></div>
          </div>
          <div class="door-inside">
            <div class="door-rack rack-one"></div>
            <div class="door-rack rack-two"></div>
            <div class="door-rack rack-three"></div>
          </div>
        </button>

        <div class="feet"><i></i><i></i></div>
      </div>
    </section>

    <div id="drag-layer" aria-hidden="true"></div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
